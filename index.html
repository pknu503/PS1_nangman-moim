<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>낭만모임 | 부경대 사회복지 전공동아리</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --pink:#F28B8B; --pink-l:#FADADD; --pink-s:#FFF5F5; --pink-m:#EF7878;
  --hora:#9B8EC4; --myth:#D4864A; --theme:#4A7FC4;
  --bg:#fff; --sur:#FFF8F8; --sur2:#FFF0F0;
  --bdr:#F5DADA; --bdr2:#ECC5C5;
  --txt:#2D1F1F; --muted:#9B7878; --light:#C4A0A0;
  --red:#E85555; --green:#4A9B6A;
  --r:12px; --rl:20px;
  --sh:0 2px 12px rgba(242,139,139,.10);
  --shl:0 8px 32px rgba(242,139,139,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--sur2)}::-webkit-scrollbar-thumb{background:var(--pink-l);border-radius:3px}

/* NAV */
nav{background:#fff;border-bottom:1.5px solid var(--bdr);box-shadow:var(--sh);position:sticky;top:0;z-index:100}
.nav-inner{max-width:1100px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{cursor:pointer;display:flex;align-items:center;gap:10px}
.logo-imgs{display:flex;gap:3px}
.logo-img{width:22px;height:22px;border-radius:5px;overflow:hidden;border:1.5px solid #ddd;object-fit:cover}
.logo-text{font-family:'Nanum Myeongjo',serif;font-size:16px;font-weight:800;color:var(--pink)}
.logo-sub{font-size:9px;color:var(--light);margin-top:1px}
.nav-links{display:flex;gap:2px}
.nav-btn{padding:8px 13px;border-radius:8px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;font-family:'Noto Sans KR',sans-serif;transition:all .15s;display:flex;align-items:center;gap:5px}
.nav-btn:hover{background:var(--pink-s);color:var(--pink)}
.nav-btn.active{background:var(--pink-s);color:var(--pink);font-weight:700}
.nav-user{display:flex;align-items:center;gap:10px}
.user-badge{font-size:12px;color:var(--muted);font-weight:600;padding:4px 10px;background:var(--sur2);border-radius:20px;border:1px solid var(--bdr)}
.mobile-nav{display:none;overflow-x:auto;gap:2px;padding:6px 12px;border-top:1px solid var(--bdr)}
@media(max-width:768px){.nav-links{display:none!important}.mobile-nav{display:flex!important}.content{padding:16px!important}.g2,.g3{grid-template-columns:1fr!important}}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:var(--r);font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .2s}
.btn-p{background:var(--pink);color:#fff;box-shadow:0 2px 8px rgba(242,139,139,.3)}
.btn-p:hover{background:var(--pink-m);transform:translateY(-1px)}
.btn-g{background:transparent;color:var(--muted);border:1.5px solid var(--bdr2)}
.btn-g:hover{background:var(--pink-s);color:var(--txt)}
.btn-d{background:rgba(232,85,85,.08);color:var(--red);border:1px solid rgba(232,85,85,.25)}
.btn-d:hover{background:rgba(232,85,85,.16)}
.btn-sm{padding:6px 14px;font-size:12px;border-radius:8px}

/* INPUTS */
.inp{width:100%;padding:12px 16px;background:var(--sur2);border:1.5px solid var(--bdr);border-radius:var(--r);color:var(--txt);font-family:'Noto Sans KR',sans-serif;font-size:14px;transition:border-color .2s,box-shadow .2s;outline:none}
.inp:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(242,139,139,.12)}
.inp::placeholder{color:var(--light)}
textarea.inp{resize:vertical;min-height:90px}
.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
select.inp{cursor:pointer}

/* CARD */
.card{background:var(--bg);border:1.5px solid var(--bdr);border-radius:var(--rl);padding:24px;box-shadow:var(--sh)}

/* TABS */
.tabs{display:flex;gap:4px;background:var(--sur2);padding:4px;border-radius:var(--r);margin-bottom:20px;border:1px solid var(--bdr)}
.tab{flex:1;padding:9px;text-align:center;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;transition:all .2s;color:var(--muted);border:none;background:transparent;font-family:'Noto Sans KR',sans-serif}
.tab.active{background:#fff;color:var(--pink);box-shadow:0 1px 4px rgba(242,139,139,.2)}

/* LAYOUT */
.page{min-height:calc(100vh - 60px);background:var(--sur)}
.content{max-width:1100px;margin:0 auto;padding:28px 20px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:14px}
.empty .ico{font-size:36px;margin-bottom:10px}
.sec-title{font-size:18px;font-weight:700;margin-bottom:16px}
.notice{background:var(--pink-s);border:1px solid var(--pink-l);border-radius:var(--r);padding:12px 16px;font-size:12px;color:var(--muted);line-height:1.8}
.notice strong{color:var(--pink-m)}
.post-card{background:var(--bg);border:1.5px solid var(--bdr);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--sh);transition:box-shadow .2s}
.post-card:hover{box-shadow:var(--shl)}

/* AUTH */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:linear-gradient(160deg,#fff 60%,#FFF0F0 100%)}
.auth-box{width:100%;max-width:420px}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-club-imgs{display:flex;justify-content:center;gap:10px;margin-bottom:16px}
.auth-club-img{width:52px;height:52px;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.auth-title{font-family:'Nanum Myeongjo',serif;font-size:26px;font-weight:800;color:var(--pink);margin-bottom:4px}
.club-tag{display:inline-block;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:700;border:1.5px solid}

/* HERO */
.hero{background:linear-gradient(135deg,#FFF0F0 0%,#fff 60%);border-bottom:1.5px solid var(--bdr);padding:40px 20px 32px}
.hero-inner{max-width:1100px;margin:0 auto}
.hero-bar{border-top:3px solid var(--pink);border-bottom:1px solid var(--pink-l);padding:8px 0;margin-bottom:24px;display:flex;justify-content:space-between}
.hero-title{font-family:'Nanum Myeongjo',serif;font-size:clamp(28px,5vw,46px);font-weight:800;line-height:1.15;margin-bottom:12px}
.hero-flex{display:flex;align-items:flex-start;gap:32px;flex-wrap:wrap}
.club-card-btn{background:#fff;border:2px solid #ddd;border-radius:16px;padding:16px;cursor:pointer;transition:all .2s;text-align:center;min-width:105px;display:flex;flex-direction:column;align-items:center;gap:8px}
.club-card-img{width:60px;height:60px;border-radius:14px;overflow:hidden;border:2px solid #ddd}

/* PILL */
.pill{padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 14px;color:var(--muted);border-bottom:2px solid var(--bdr);font-weight:600;background:var(--sur2)}
td{padding:11px 14px;border-bottom:1px solid var(--bdr)}

/* PROGRESS */
.prog-bar{background:var(--sur2);border-radius:4px;height:7px;overflow:hidden;margin:6px 0}
.prog-fill{height:100%;border-radius:4px;transition:width .5s}

/* PWD toggle */
.pw-wrap{position:relative}
.pw-wrap .inp{padding-right:44px}
.pw-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;color:var(--muted)}

/* 로딩 화면 */
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(.95)}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<script>
// ============ DATA ============
const GITHUB_RAW = 'https://raw.githubusercontent.com/pknu503/PS1_nangman-moim/main';
const CLUBS = {
  hora:{id:'hora',name:'오라',en:'Hora',color:'#9B8EC4',emoji:'🕐',logo:`${GITHUB_RAW}/%EC%98%A4%EB%9D%BC.jpg`,desc:'시간을 함께하는 동아리',boardName:'오라타임'},
  myth:{id:'myth',name:'클럽신화',en:'MYTH',color:'#D4864A',emoji:'🔥',logo:`${GITHUB_RAW}/%EC%8B%A0%ED%99%94.jpg`,desc:'신화를 만들어가는 동아리',boardName:'신화창조'},
  theme:{id:'theme',name:'띰',en:'Theme',color:'#4A7FC4',emoji:'🔍',logo:`${GITHUB_RAW}/%EB%9D%94.png`,desc:'주제를 탐구하는 동아리',boardName:'테마찾기'},
};

const ADMIN_ID='50325', ADMIN_PW='27341004';
const YEARS=Array.from({length:41},(_,i)=>2010+i);
const DB='https://ps1nangman-default-rtdb.firebaseio.com';

// ── Firebase REST API helpers ──────────────────────────────────────────────
async function fbGet(path){
  try{
    const r=await fetch(DB+'/'+path+'.json');
    const d=await r.json();
    return d===null?undefined:d;
  }catch(e){
    console.warn('fbGet failed:',path,e.message);
    return undefined;
  }
}

async function fbSet(path,val){
  try{
    await fetch(DB+'/'+path+'.json',{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(val)
    });
  }catch(e){
    console.error('fbSet error',e.message);
  }
}

async function fbPatch(path,obj){
  try{
    await fetch(DB+'/'+path+'.json',{
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(obj)
    });
  }catch(e){console.error('fbPatch error',e.message);}
}

async function fbDelete(path){
  try{
    // 경로의 마지막 세그먼트 키를 안전하게 변환
    const safePath=path.split('/').map(seg=>seg.replace(/[.$#\[\]\/]/g,'_')).join('/');
    await fetch(DB+'/'+safePath+'.json',{method:'DELETE'});
  }catch(e){console.error('fbDelete error',e.message);}
}

function arrToObj(arr,keyField='id'){
  const obj={};
  (arr||[]).forEach(item=>{
    if(item&&item[keyField]){
      // Firebase 키에 . $ # [ ] / 금지 → 안전하게 변환
      const safeKey=String(item[keyField]).replace(/[.$#\[\]\/]/g,'_');
      obj[safeKey]=item;
    }
  });
  return obj;
}

function attendToObj(arr){
  const obj={};
  (arr||[]).forEach(a=>{
    if(a&&a.key){
      const safeKey=a.key.replace(/[^a-zA-Z0-9]/g,'_');
      obj[safeKey]=a;
    }
  });
  return obj;
}

// localStorage
function ld(k,d){try{const r=localStorage.getItem(k);return r?JSON.parse(r):d}catch{return d}}
function sv(k,v){localStorage.setItem(k,JSON.stringify(v))}

// State
let state={
  user: ld('nm_user',null),
  isAdmin: ld('nm_admin',false),
  members: ld('nm_members',[]),
  posts: ld('nm_posts',[]),
  schedules: ld('nm_schedules',[]),
  events: ld('nm_events',[]),
  attendance: ld('nm_attend',[]),
  promos: ld('nm_promos',[]),
  pwRequests: ld('nm_pwreq',[]),
  withdrawals: ld('nm_withdrawals',[]),
  page:'home',
  subPage:{},
};

function saveLocal(){
  sv('nm_user',state.user);sv('nm_admin',state.isAdmin);
  sv('nm_members',state.members);sv('nm_posts',state.posts);
  sv('nm_schedules',state.schedules);sv('nm_events',state.events);
  sv('nm_attend',state.attendance);sv('nm_promos',state.promos);
  sv('nm_pwreq',state.pwRequests);sv('nm_withdrawals',state.withdrawals||[]);
}

function save(){
  saveLocal();
  // PATCH: 기존 데이터와 병합 저장 (다른 사람 데이터 덮어쓰기 방지)
  fbPatch('members',    arrToObj(state.members));
  fbPatch('posts',      arrToObj(state.posts));
  fbPatch('schedules',  arrToObj(state.schedules));
  fbPatch('events',     arrToObj(state.events));
  fbPatch('promos',     arrToObj(state.promos));
  fbPatch('pwRequests', arrToObj(state.pwRequests));
  fbPatch('withdrawals',arrToObj(state.withdrawals));
  fbPatch('attendance', attendToObj(state.attendance));
}

// 항목 삭제 시 Firebase에서도 삭제
async function fbRemoveItem(collection, id){
  state[collection]=state[collection].filter(x=>x.id!==id);
  saveLocal();
  await fbDelete(collection+'/'+id);
  render();
}
async function fbRemoveAttend(key){
  state.attendance=state.attendance.filter(a=>a.key!==key);
  saveLocal();
  const safeKey=key.replace(/[^a-zA-Z0-9]/g,'_');
  await fbDelete('attendance/'+safeKey);
}

function toArr(v){
  if(!v) return [];
  if(Array.isArray(v)) return v.filter(x=>x!=null);
  return Object.values(v).filter(x=>x!=null);
}

// ── Firebase 전체 로드 (절대 throw 안 함) ─────────────────────────────────
async function loadFromFirebase(){
  try{
    const [members,posts,schedules,events,attendance,promos,pwRequests,withdrawals]=await Promise.all([
      fbGet('members'), fbGet('posts'), fbGet('schedules'), fbGet('events'),
      fbGet('attendance'), fbGet('promos'), fbGet('pwRequests'), fbGet('withdrawals'),
    ]);
    if(members    !== undefined) state.members    = toArr(members);
    if(posts      !== undefined) state.posts      = toArr(posts);
    if(schedules  !== undefined) state.schedules  = toArr(schedules);
    if(events     !== undefined) state.events     = toArr(events);
    if(attendance !== undefined) state.attendance = toArr(attendance);
    if(promos     !== undefined) state.promos     = toArr(promos);
    if(pwRequests !== undefined) state.pwRequests = toArr(pwRequests);
    if(withdrawals!== undefined) state.withdrawals= toArr(withdrawals);
    // 로그인된 사용자 정보를 Firebase 최신 데이터로 동기화
    if(state.user && state.user.id){
      const fresh=state.members.find(m=>m.id===state.user.id);
      if(fresh) state.user=fresh;
    }
    saveLocal();
    console.log('Firebase loaded: members='+state.members.length);
  }catch(e){
    console.warn('Firebase load error (로컬 데이터 사용):', e.message);
  }
}

// ============ HELPERS ============
function logoImg(club,size=28,radius=7){
  const half=Math.round(size*.5);
  const fallback=club.emoji;
  return '<div style="width:'+size+'px;height:'+size+'px;border-radius:'+radius+'px;overflow:hidden;border:1.5px solid '+club.color+'40;flex-shrink:0;background:'+club.color+'15;display:flex;align-items:center;justify-content:center;">'
    +'<img src="'+club.logo+'" alt="'+club.name+'" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'<span style=&quot;font-size:'+half+'px&quot;>'+fallback+'</span>\'">'
    +'</div>';
}
function fmtDate(d){return new Date(d).toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'})}
function fmtShort(d){return new Date(d).toLocaleDateString('ko-KR')}
function uid(){return (Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/[^a-z0-9]/g,'')}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function psMark(status){
  const isGrad=status==='graduated';
  const bg=isGrad?'#F28B8B':'#2E7EC7';
  const label=isGrad?'PS0':'PS1';
  return '<span style="font-size:9px;font-weight:800;padding:1px 5px;border-radius:4px;background:'+bg+';color:#fff;letter-spacing:0.5px;vertical-align:middle;flex-shrink:0">'+label+'</span>';
}
function emptyState(ico,msg){
  return '<div class="empty"><div class="ico">'+ico+'</div><p>'+msg+'</p></div>';
}
function makeTabHtml(tabs,activeId,subPageKey){
  return '<div class="tabs">'+tabs.map(function(t){
    var id=t[0],label=t[1];
    return '<button class="tab '+(activeId===id?'active':'')+'" onclick="setSubPage(\''+subPageKey+'\',\''+id+'\')">'+label+'</button>';
  }).join('')+'</div>';
}

// ============ RENDER ENGINE ============
function render(){
  if(!state.user){renderAuth();return;}
  renderApp();
}

// Firebase 실시간 polling (5초마다)
let _pollTimer=null;
let _modalOpen=false; // 모달/폼 입력 중 플래그

// 사용자가 입력 중인지 감지
function isUserTyping(){
  const active=document.activeElement;
  if(!active)return false;
  const tag=active.tagName.toLowerCase();
  return tag==='input'||tag==='textarea'||tag==='select';
}

function startPolling(){
  if(_pollTimer)clearInterval(_pollTimer);
  _pollTimer=setInterval(async()=>{
    if(!state.user)return;
    // 모달 열려있거나 사용자가 입력 중이면 완전히 건너뜀
    if(_modalOpen||isUserTyping())return;
    // 현재 페이지가 홈/동아리 게시판처럼 입력폼이 있는 경우 데이터만 조용히 갱신
    const quietPages=['home','hora','myth','theme','profile'];
    if(quietPages.includes(state.page)){
      // 화면 재렌더 없이 데이터만 업데이트
      await loadFromFirebase();
      return;
    }
    // 통합현황·관리자 페이지만 자동 화면 갱신
    await loadFromFirebase();
    render();
  },8000); // 8초로 늘려서 사용성 개선
}
function stopPolling(){if(_pollTimer){clearInterval(_pollTimer);_pollTimer=null;}}

// ============ AUTH ============
function renderAuth(){
  const mode=state.authMode||'login';
  document.body.innerHTML=`
  <div class="auth-wrap">
    <div class="auth-box">
      <div class="auth-logo">
        <div class="auth-club-imgs">
          ${Object.values(CLUBS).map(c=>`<div style="display:flex;flex-direction:column;align-items:center;gap:6px">
            <div class="auth-club-img">${logoImg(c,52,14)}</div>
            <span style="font-size:11px;font-weight:700;color:${c.color}">${c.name}</span>
          </div>`).join('')}
        </div>
        <div class="auth-title">낭만모임</div>
        <div style="color:var(--muted);font-size:13px">부경대 사회복지학 전공동아리 모이다</div>
      </div>
      <div class="tabs">
        <button class="tab ${mode==='login'?'active':''}" onclick="state.authMode='login';render()">로그인</button>
        <button class="tab ${mode==='register'?'active':''}" onclick="state.authMode='register';render()">신규 가입</button>
      </div>
      <div class="card">
        ${mode==='login'?renderLogin():renderRegister()}
      </div>
    </div>
  </div>`;
}

function renderLogin(){
  return `
  <div style="display:flex;flex-direction:column;gap:14px">
    <div class="notice">
      <strong>로그인 안내</strong><br>
      • 일반 회원: 가입 시 등록한 <strong>이름</strong>과 <strong>8자리 숫자 비밀번호</strong><br>
      • 관리자: 관리자 ID(<strong>${ADMIN_ID}</strong>)와 비밀번호로 로그인
    </div>
    <div><label class="lbl">이름 (또는 관리자 ID)</label>
      <input class="inp" id="li-name" placeholder="이름 입력" onfocus="_modalOpen=true"></div>
    <div><label class="lbl">비밀번호 (8자리 숫자)</label>
      <div class="pw-wrap"><input class="inp" id="li-pw" type="password" placeholder="8자리 비밀번호" onfocus="_modalOpen=true" maxlength="8">
      <button class="pw-eye" onclick="togglePw('li-pw',this)">👁️</button></div></div>
    <div id="li-err" style="color:var(--red);font-size:13px;display:none;padding:8px 12px;background:#fff0f0;border-radius:8px"></div>
    <button class="btn btn-p" style="width:100%;justify-content:center" onclick="doLogin()">로그인</button>
  </div>`;
}

function renderRegister(){
  return `
  <div style="display:flex;flex-direction:column;gap:12px">
    <div class="notice">
      <strong>비밀번호 안내</strong><br>
      비밀번호는 <strong>숫자 8자리</strong>로 설정해주세요.<br>예: 19991231 (생년월일 형식 추천)
    </div>
    <div><label class="lbl">이름</label><input class="inp" id="rg-name" placeholder="실명 입력" onfocus="_modalOpen=true"></div>
    <div><label class="lbl">학번 (입학연도)</label>
      <select onfocus="_modalOpen=true" onmousedown="_modalOpen=true" class="inp" id="rg-year"><option value="">학번 선택</option>

function togglePw(id,btn){
  const el=document.getElementById(id);
  if(el.type==='password'){el.type='text';btn.textContent='🙈';}
  else{el.type='password';btn.textContent='👁️';}
}

let _selClubs=[];
let _selStatus='active';
function selectStatus(val){
  _selStatus=val;
  ['active','graduated'].forEach(s=>{
    const lbl=document.getElementById('lbl-'+s);
    if(!lbl)return;
    const sel=s===val;
    lbl.style.borderColor=sel?(s==='graduated'?'#F28B8B':'#2E7EC7'):'var(--bdr)';
    lbl.style.background=sel?(s==='graduated'?'#fff0f0':'#f0f7ff'):'var(--sur2)';
  });
}
function toggleClubSel(id){
  const idx=_selClubs.indexOf(id);
  if(idx>=0) _selClubs.splice(idx,1);
  else _selClubs.push(id);

  Object.values(CLUBS).forEach(c=>{
    const btn=document.getElementById('clubbtn-'+c.id);
    const txt=document.getElementById('clbtxt-'+c.id);
    const chk=document.getElementById('chkmark-'+c.id);
    if(!btn) return;
    const sel=_selClubs.includes(c.id);
    btn.style.borderColor = sel ? c.color : 'var(--bdr)';
    btn.style.background  = sel ? c.color+'18' : 'var(--sur2)';
    btn.style.boxShadow   = sel ? '0 2px 8px '+c.color+'40' : 'none';
    if(txt) txt.style.color = sel ? c.color : 'var(--muted)';
    if(chk){ chk.style.display=sel?'inline':'none'; chk.style.color=c.color; }
  });

  const info=document.getElementById('club-sel-info');
  if(info){
    if(_selClubs.length===0){
      info.textContent='동아리를 선택해주세요.';
      info.style.color='var(--muted)';
    } else {
      const names=_selClubs.map(cid=>CLUBS[cid]?.name).join(', ');
      info.innerHTML='✅ 선택된 동아리: <strong style="color:var(--pink)">'+names+'</strong>';
    }
  }
}

function showErr(id,msg){const el=document.getElementById(id);if(el){el.textContent=msg;el.style.display='block';}}
function hideErr(id){const el=document.getElementById(id);if(el)el.style.display='none';}

function doLogin(){
  hideErr('li-err');
  const name=document.getElementById('li-name').value.trim();
  const pw=document.getElementById('li-pw').value.trim();
  if(!name||!pw){showErr('li-err','이름과 비밀번호를 입력해주세요.');return;}
  if(name===ADMIN_ID&&pw===ADMIN_PW){
    state.user={id:'admin',name:'관리자',studentYear:'관리자',clubs:Object.keys(CLUBS),gender:'-'};
    state.isAdmin=true;state.page='home';
    showLoadingScreen('로그인 중...');
    loadFromFirebase().then(()=>{render();startPolling();});
    return;
  }
  const m=state.members.find(x=>x.name===name&&x.password===pw);
  if(!m){showErr('li-err','이름 또는 비밀번호가 일치하지 않습니다.');return;}
  state.user=m;state.isAdmin=false;state.page='home';
  loadFromFirebase().then(()=>{render();startPolling();});
}

function doRegister(){
  hideErr('rg-err');hideErr('rg-ok');
  const name=document.getElementById('rg-name').value.trim();
  const year=document.getElementById('rg-year').value;
  const gender=document.getElementById('rg-gender').value;
  const pw=document.getElementById('rg-pw').value;
  const pw2=document.getElementById('rg-pw2').value;
  if(!name)return showErr('rg-err','이름을 입력해주세요.');
  if(!year)return showErr('rg-err','학번을 선택해주세요.');
  if(!/^\d{8}$/.test(pw))return showErr('rg-err','비밀번호는 8자리 숫자여야 합니다.');
  if(pw!==pw2)return showErr('rg-err','비밀번호가 일치하지 않습니다.');
  if(_selClubs.length===0)return showErr('rg-err','최소 하나의 동아리를 선택해주세요.');
  if(state.members.find(m=>m.name===name&&m.studentYear===year))return showErr('rg-err','이미 등록된 이름+학번 조합입니다.');
  const m={id:uid(),name,studentYear:year,gender,clubs:[..._selClubs],password:pw,status:_selStatus,joinedAt:new Date().toISOString()};
  state.members.push(m);state.user=m;state.isAdmin=false;state.page='home';
  _selClubs=[];_selStatus='active';
  saveLocal();
  const safeRegId=String(m.id).replace(/[.$#\[\]\/]/g,'_');
  fbPatch('members',{[safeRegId]:m});
  render();
  startPolling();
  setTimeout(()=>loadFromFirebase().then(()=>render()), 1500);
}

  if(!clubId||!title||!content)return alert('모든 항목을 입력해주세요.');

function renderClubAttend(clubId,club){
  const clubMembers=state.members.filter(m=>m.clubs?.includes(clubId));
  if(!state.isAdmin){
    const myR=state.attendance.filter(a=>a.clubId===clubId&&a.memberId===state.user.id);
    const present=myR.filter(r=>r.status==='present').length;
    const late=myR.filter(r=>r.status==='late').length;
    const absent=myR.filter(r=>r.status==='absent').length;
    const total=myR.length;
    const rate=total>0?Math.round((present/total)*100):0;
    return `<div class="card" style="border-top:3px solid ${club.color}">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">내 출석 현황</h3>
      <div style="display:flex;gap:24px;justify-content:center;margin-bottom:16px">
        ${[['출석',present,'#4A9B6A'],['지각',late,'#D4864A'],['결석',absent,'#E85555']].map(([l,v,c])=>`<div style="text-align:center"><div style="font-size:28px;font-weight:900;color:${c}">${v}</div><div style="font-size:12px;color:var(--muted)">${l}</div></div>`).join('')}
      </div>
      <div class="prog-bar"><div class="prog-fill" style="width:${rate}%;background:${club.color}"></div></div>
      <p style="font-size:13px;color:var(--muted);text-align:center">출석률 ${rate}% (${total}회 중 ${present}회)</p>
    </div>`;
  }

  const today=new Date().toISOString().split('T')[0];
  const dateVal=state.attendDate||today;
  const getStatus=(memberId)=>{
    const key=`${clubId}_${memberId}_${dateVal}`;
    return state.attendance.find(a=>a.key===key)?.status||null;
  };
  const statusColor={present:'#4A9B6A',late:'#D4864A',absent:'#E85555'};
  const rows=clubMembers.map(m=>{
    const s=getStatus(m.id);
    return `<div class="card" style="padding:12px 18px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:34px;height:34px;border-radius:10px;background:${club.color}15;border:1.5px solid ${club.color}40;display:flex;align-items:center;justify-content:center;font-weight:800;color:${club.color}">${esc(m.name[0])}</div>
        <div><div style="font-weight:600;font-size:14px;display:flex;align-items:center;gap:5px">${esc(m.name)}(${String(m.studentYear).slice(2)}) ${psMark(m.status)}</div><div style="font-size:12px;color:var(--muted)">${m.studentYear}학번 · ${m.status==='graduated'?'졸업생':'현역'}</div></div>
      </div>
      <div style="display:flex;gap:5px">
        ${[['present','출석'],['late','지각'],['absent','결석']].map(([st,label])=>`
        <button onclick="markAttend('${clubId}','${m.id}','${dateVal}','${st}')"
          style="padding:5px 11px;border-radius:7px;border:1px solid ${s===st?statusColor[st]:'var(--bdr)'};cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:600;background:${s===st?statusColor[st]:'var(--sur2)'};color:${s===st?'#fff':'var(--muted)'}">${label}</button>`).join('')}
      </div>
    </div>`;
  }).join('');

  return `<h2 class="sec-title">출석 관리</h2>
  <div style="margin-bottom:16px;display:flex;align-items:center;gap:12px">
    <label class="lbl" style="margin:0;white-space:nowrap">날짜:</label>
    <input class="inp" type="date" value="${dateVal}" onchange="state.attendDate=this.value;render()" style="width:auto">
  </div>
  ${clubMembers.length===0?emptyState('👥','회원이 없습니다.'):rows}`;
}

function markAttend(clubId,memberId,date,status){
  const key=`${clubId}_${memberId}_${date}`;
  state.attendance=state.attendance.filter(a=>a.key!==key);
  const item={key,clubId,memberId,date,status};
  state.attendance.push(item);
  saveLocal();
  const safeKey=key.replace(/[^a-zA-Z0-9]/g,'_');
  fbPatch('attendance',{[safeKey]:item});
  render();
}

function renderClubMembers(clubId,club){
  const members=state.members.filter(m=>m.clubs?.includes(clubId));
  return `<h2 class="sec-title">동아리 회원 (${members.length}명)</h2>
  ${(()=>{
    if(members.length===0) return emptyState('👤','가입된 회원이 없습니다.');
    return '<div class="g2">'+members.map(m=>{
      const badges=(m.clubs||[]).map(c=>'<span style="padding:1px 7px;border-radius:10px;background:'+(CLUBS[c]?.color||'#999')+'15;color:'+(CLUBS[c]?.color||'#999')+';font-size:10px;font-weight:700">'+(CLUBS[c]?.name||c)+'</span>').join('');

        +'<div><div style="font-weight:700;font-size:14px;display:flex;align-items:center;gap:5px">'+esc(m.name)+'('+String(m.studentYear).slice(2)+') '+psMark(m.status)+'</div>'
        +'<div style="font-size:12px;color:var(--muted)">'+m.studentYear+'학번 · '+(m.gender==='male'?'남':m.gender==='female'?'여':'기타')+' · '+(m.status==='graduated'?'졸업생':'현역')+'</div>'

function doForceWithdraw(memberId, memberName){
  const sel=document.getElementById('fw-reason-sel');
  const custom=document.getElementById('fw-reason-custom');
  const err=document.getElementById('fw-err');
  let reason=sel.value==='직접입력'?custom.value.trim():sel.value;
  if(!reason){err.textContent='탈퇴 사유를 선택하거나 입력해주세요.';err.style.display='block';return;}
  const member=state.members.find(m=>m.id===memberId);
  if(member){
    const wItem={id:uid(), memberId, memberName,
      studentYear:member.studentYear, gender:member.gender,
      clubs:member.clubs, status:member.status, reason,
      withdrawnAt:new Date().toISOString(), withdrawnBy:'관리자'};
    state.withdrawals.push(wItem);
    state.members=state.members.filter(m=>m.id!==memberId);
    saveLocal();
    fbPatch('withdrawals',{[wItem.id]:wItem});
    fbDelete('members/'+memberId);
  }
  _modalOpen=false;
  document.getElementById('fw-overlay').remove();
  render();
}

function setEditStatus(val){
  window._editStatus=val;
  const actBtn=document.getElementById('edit-status-active');
  const gradBtn=document.getElementById('edit-status-graduated');
  if(!actBtn||!gradBtn)return;
  if(val==='active'){
    actBtn.style.borderColor='#2E7EC7';actBtn.style.background='#f0f7ff';actBtn.style.color='#2E7EC7';
    gradBtn.style.borderColor='var(--bdr)';gradBtn.style.background='var(--sur2)';gradBtn.style.color='var(--muted)';
  } else {
    gradBtn.style.borderColor='#F28B8B';gradBtn.style.background='#fff0f0';gradBtn.style.color='var(--pink)';
    actBtn.style.borderColor='var(--bdr)';actBtn.style.background='var(--sur2)';actBtn.style.color='var(--muted)';
  }
}

function toggleEditClub(id){
  if(!window._editClubs) window._editClubs=[];
  const idx=window._editClubs.indexOf(id);
  if(idx>=0) window._editClubs.splice(idx,1);
  else window._editClubs.push(id);
  Object.values(CLUBS).forEach(c=>{
    const btn=document.getElementById('edit-club-'+c.id);
    const txt=document.getElementById('edit-club-txt-'+c.id);
    const chk=document.getElementById('edit-club-chk-'+c.id);
    if(!btn)return;
    const sel=window._editClubs.includes(c.id);
    btn.style.borderColor=sel?c.color:'var(--bdr)';
    btn.style.background=sel?c.color+'18':'var(--sur2)';
    btn.style.boxShadow=sel?'0 2px 8px '+c.color+'40':'none';
    if(txt)txt.style.color=sel?c.color:'var(--muted)';
    if(chk)chk.style.display=sel?'inline':'none';
  });
  updateEditClubInfo();
}

function updateEditClubInfo(){
  const info=document.getElementById('edit-club-info');
  if(!info)return;
  if(!window._editClubs||window._editClubs.length===0){
    info.textContent='동아리를 선택해주세요.';info.style.color='var(--muted)';
  } else {
    const names=window._editClubs.map(cid=>CLUBS[cid]?.name).join(', ');
    info.innerHTML='✅ 선택: <strong style="color:var(--pink)">'+names+'</strong>';
  }
}

function doEditProfile(){
  const name=document.getElementById('edit-name').value.trim();
  const year=document.getElementById('edit-year').value;
  const gender=document.getElementById('edit-gender').value;
  const err=document.getElementById('edit-err');
  const ok=document.getElementById('edit-ok');
  err.style.display='none';ok.style.display='none';
  if(!name){err.textContent='이름을 입력해주세요.';err.style.display='block';return;}
  if(!window._editClubs||window._editClubs.length===0){err.textContent='동아리를 선택해주세요.';err.style.display='block';return;}
  // 이름 중복 체크 (자기 자신 제외, == 로 타입 무관 비교)
  const dup=state.members.find(m=>m.name===name&&String(m.studentYear)===String(year)&&m.id!==state.user.id);
  if(dup){err.textContent='같은 이름+학번 조합이 이미 존재합니다.';err.style.display='block';return;}
  const idx=state.members.findIndex(m=>m.id===state.user.id);
  if(idx<0){err.textContent='회원 정보를 찾을 수 없습니다.';err.style.display='block';return;}
  // 수정 적용
  state.members[idx].name=name;
  state.members[idx].studentYear=year;
  state.members[idx].gender=gender;
  state.members[idx].status=window._editStatus||'active';
  state.members[idx].clubs=[...window._editClubs];
  state.user=state.members[idx];
  saveLocal();
  // Firebase 키 안전하게 변환 후 저장
  const safeId=String(state.user.id).replace(/[.$#\[\]\/]/g,'_');
  fbPatch('members',{[safeId]:state.members[idx]});
  // 모달 닫고 화면 갱신
  _modalOpen=false;
  const overlay=document.getElementById('edit-overlay');
  if(overlay)overlay.remove();
  alert('✅ 정보가 저장되었습니다!');
  render();
  // 2초 후 Firebase에서 저장 확인 (반영 여부 검증)
  setTimeout(()=>loadFromFirebase().then(()=>render()), 2000);
}

    </p>
    <div style="background:#fff0f0;border:1px solid rgba(232,85,85,.2);border-radius:12px;padding:14px;margin-bottom:16px">
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600">탈퇴하는 계정</div>
      <div style="font-size:15px;font-weight:700">${esc(state.user.name)} (${state.user.studentYear}학번)</div>
    </div>
    <div style="margin-bottom:14px">
      <label class="lbl">탈퇴 확인을 위해 비밀번호를 입력하세요</label>
      <div class="pw-wrap">
        <input class="inp" id="sw-pw" type="password" placeholder="현재 비밀번호 8자리" maxlength="8" onfocus="_modalOpen=true" oninput="this.value=this.value.replace(/\\D/g,'')">
        <button class="pw-eye" onclick="togglePw('sw-pw',this)">👁️</button>
      </div>
    </div>
    <div id="sw-err" style="display:none;color:var(--red);font-size:13px;padding:8px 12px;background:#fff0f0;border-radius:8px;margin-bottom:12px"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button onclick="_modalOpen=false;document.getElementById('sw-overlay').remove()" class="btn btn-g btn-sm">취소</button>
      <button onclick="doSelfWithdraw()" style="padding:9px 18px;border-radius:10px;border:none;background:var(--red);color:#fff;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:13px">🚪 탈퇴하기</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
}

function doSelfWithdraw(){
  const pw=document.getElementById('sw-pw').value;
  const err=document.getElementById('sw-err');
  err.style.display='none';
  if(!pw){err.textContent='비밀번호를 입력해주세요.';err.style.display='block';return;}
  if(pw!==state.user.password){err.textContent='비밀번호가 일치하지 않습니다.';err.style.display='block';return;}
  const u=state.user;
  // 탈퇴 이력 저장
  const wItem={id:uid(),memberId:u.id,memberName:u.name,studentYear:u.studentYear,
    gender:u.gender,clubs:u.clubs,status:u.status,reason:'자진 탈퇴',
    withdrawnAt:new Date().toISOString(),withdrawnBy:'본인'};
  state.withdrawals.push(wItem);
  state.members=state.members.filter(m=>m.id!==u.id);
  saveLocal();
  fbPatch('withdrawals',{[wItem.id]:wItem});
  fbDelete('members/'+u.id);
  _modalOpen=false;
  document.getElementById('sw-overlay').remove();
  stopPolling();
  state.user=null;state.isAdmin=false;
  alert('탈퇴가 완료되었습니다. 이용해 주셔서 감사합니다.');
  render();
}

// ============ PASSWORD CHANGE ============
function renderChangePw(){
  return `
  <div id="cpw-wrap" class="card" style="margin-bottom:20px;border:1.5px solid var(--pink-l)">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
      <div style="width:4px;height:18px;background:var(--pink);border-radius:2px"></div>
      <h3 style="font-size:16px;font-weight:700">비밀번호 변경</h3>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="notice">현재 비밀번호 확인 후 새 비밀번호(8자리 숫자)를 설정합니다.</div>
      <div><label class="lbl">현재 비밀번호</label>
        <div class="pw-wrap"><input class="inp" id="cpw-old" onfocus="_modalOpen=true" type="password" placeholder="현재 비밀번호 8자리" maxlength="8" oninput="this.value=this.value.replace(/\D/g,'')">
        <button class="pw-eye" onclick="togglePw('cpw-old',this)">👁️</button></div></div>
      <div><label class="lbl">새 비밀번호</label>
        <div class="pw-wrap"><input class="inp" id="cpw-new" onfocus="_modalOpen=true" type="password" placeholder="새 비밀번호 8자리" maxlength="8" oninput="this.value=this.value.replace(/\D/g,'')">
        <button class="pw-eye" onclick="togglePw('cpw-new',this)">👁️</button></div></div>
      <div><label class="lbl">새 비밀번호 확인</label>
        <div class="pw-wrap"><input class="inp" id="cpw-new2" onfocus="_modalOpen=true" type="password" placeholder="새 비밀번호 재입력" maxlength="8" oninput="this.value=this.value.replace(/\D/g,'')">
        <button class="pw-eye" onclick="togglePw('cpw-new2',this)">👁️</button></div></div>
      <div id="cpw-err" style="display:none;color:var(--red);font-size:13px;padding:8px 12px;background:#fff0f0;border-radius:8px"></div>
      <div id="cpw-ok" style="display:none;color:var(--green);font-size:13px;padding:8px 12px;background:#f0fff6;border-radius:8px"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn btn-g btn-sm" onclick="_modalOpen=false;document.getElementById('cpw-wrap').style.display='none'">취소</button>
        <button class="btn btn-p btn-sm" onclick="doChangePw()">변경하기</button>
      </div>
    </div>
  </div>`;
}

function doChangePw(){
  const old=document.getElementById('cpw-old').value;
  const nw=document.getElementById('cpw-new').value;
  const nw2=document.getElementById('cpw-new2').value;
  const err=document.getElementById('cpw-err');
  const ok=document.getElementById('cpw-ok');
  err.style.display='none';ok.style.display='none';
  if(!old||!nw||!nw2){err.textContent='모든 항목을 입력해주세요.';err.style.display='block';return;}
  if(old!==state.user.password){err.textContent='현재 비밀번호가 일치하지 않습니다.';err.style.display='block';return;}
  if(!/^\d{8}$/.test(nw)){err.textContent='새 비밀번호는 8자리 숫자여야 합니다.';err.style.display='block';return;}
  if(nw===old){err.textContent='새 비밀번호가 기존 비밀번호와 같습니다.';err.style.display='block';return;}
  if(nw!==nw2){err.textContent='새 비밀번호가 일치하지 않습니다.';err.style.display='block';return;}
  const idx=state.members.findIndex(m=>m.id===state.user.id);
  if(idx>=0){
    state.members[idx].password=nw;
    state.user=state.members[idx];
    saveLocal();
    const safePwId=String(state.user.id).replace(/[.$#\[\]\/]/g,'_');
    fbPatch('members',{[safePwId]:state.members[idx]});
  }
  _modalOpen=false;
  ok.textContent='✅ 비밀번호가 변경되었습니다!';ok.style.display='block';
  document.getElementById('cpw-old').value='';
  document.getElementById('cpw-new').value='';
  document.getElementById('cpw-new2').value='';
}

// ============ PASSWORD REQUEST ============
function renderPwRequest(){
  const myReq=state.pwRequests.filter(r=>r.memberId===state.user.id);
  const lastReq=myReq[myReq.length-1];
  return `
  <div class="card" style="margin-bottom:20px;border:1.5px solid var(--bdr)">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
      <div style="width:4px;height:18px;background:var(--hora);border-radius:2px"></div>
      <h3 style="font-size:16px;font-weight:700">비밀번호 찾기 요청</h3>
    </div>
    ${lastReq&&lastReq.status==='pending'?`
    <div class="notice" style="margin-bottom:12px">
      <strong>⏳ 요청 대기 중</strong><br>
      ${lastReq.createdAt.slice(0,10)} 에 요청하셨습니다.<br>
      관리자가 확인 후 비밀번호를 알려드립니다.
    </div>`:''}
    ${lastReq&&lastReq.status==='done'?`
    <div style="background:#f0fff6;border:1.5px solid #4A9B6A40;border-radius:var(--r);padding:14px 16px;margin-bottom:12px">
      <div style="font-weight:700;color:var(--green);margin-bottom:6px">✅ 관리자 답변 완료</div>
      <div style="font-size:13px;color:var(--txt);line-height:1.7">${esc(lastReq.adminReply||'')}</div>
    </div>`:''}
    <div style="display:flex;flex-direction:column;gap:10px">
      <p style="font-size:13px;color:var(--muted);line-height:1.7">비밀번호를 잊으셨나요? 관리자에게 요청을 보내세요.</p>
      <textarea class="inp" id="pwreq-msg" placeholder="관리자에게 전달할 메시지 (선택)" style="min-height:70px" onfocus="_modalOpen=true"></textarea>
      <button class="btn btn-p btn-sm" style="align-self:flex-end" onclick="submitPwRequest()">요청 보내기</button>
    </div>
  </div>`;
}

function submitPwRequest(){
  const msg=document.getElementById('pwreq-msg').value.trim();
  const already=state.pwRequests.find(r=>r.memberId===state.user.id&&r.status==='pending');
  if(already){alert('이미 처리 대기 중인 요청이 있습니다.');return;}
  const item={id:uid(), memberId:state.user.id, memberName:state.user.name,
    studentYear:state.user.studentYear, msg, status:'pending',
    createdAt:new Date().toISOString(), adminReply:'', repliedAt:null};
  state.pwRequests.push(item);
  saveLocal();
  fbPatch('pwRequests',{[item.id]:item});
  alert('✅ 요청이 전송되었습니다!');
  render();
}

function renderAdminPwRequests(){
  const reqs=[...state.pwRequests].reverse();
  const pending=reqs.filter(r=>r.status==='pending');
  return `
  <div style="margin-bottom:6px;display:flex;align-items:center;gap:8px">
    <h2 class="sec-title" style="margin:0">비밀번호 요청</h2>
    ${pending.length>0?`<span style="background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px">${pending.length}건 대기</span>`:''}
  </div>
  ${reqs.length===0?`<div class="empty"><div class="ico">📭</div><p>비밀번호 요청이 없습니다.</p></div>`:
  reqs.map(r=>{
    const member=state.members.find(m=>m.id===r.memberId);
    const actualPw=member?member.password:'(탈퇴 회원)';
    return `
    <div class="card" style="margin-bottom:10px;padding:16px 20px;border-left:4px solid ${r.status==='done'?'var(--green)':'var(--pink)'}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">
        <div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <span style="font-weight:700;font-size:14px">${esc(r.memberName)}</span>
            <span style="font-size:12px;color:var(--muted)">${r.studentYear}학번</span>
            <span style="font-size:11px;padding:2px 9px;border-radius:20px;font-weight:700;${r.status==='done'?'background:#f0fff6;color:var(--green)':'background:#fff0f0;color:var(--red)'}">
              ${r.status==='done'?'✅ 완료':'⏳ 대기중'}
            </span>
          </div>
          ${r.msg?`<p style="font-size:13px;color:var(--muted);margin-bottom:4px">메시지: ${esc(r.msg)}</p>`:''}
          <p style="font-size:11px;color:var(--light)">${fmtShort(r.createdAt)} 요청</p>
          ${r.status==='pending'?`
          <div style="margin-top:10px;padding:10px 14px;background:var(--sur2);border-radius:10px;border:1px solid var(--bdr)">
            <p style="font-size:12px;color:var(--muted);margin-bottom:6px">실제 비밀번호: <strong style="color:var(--txt);font-size:14px;letter-spacing:2px">${actualPw}</strong></p>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              <input class="inp" id="reply-${r.id}" placeholder="학생에게 전달할 메시지" style="flex:1;min-width:200px" onfocus="_modalOpen=true">
              <button class="btn btn-p btn-sm" onclick="replyPwRequest('${r.id}')">답변 보내기</button>
            </div>
          </div>`:`
          <div style="margin-top:8px;font-size:12px;color:var(--muted)">
            답변: ${esc(r.adminReply||'')}
          </div>`}
        </div>
      </div>
    </div>`;
  }).join('')}`;
}

function replyPwRequest(reqId){
  const reply=document.getElementById('reply-'+reqId).value.trim();
  if(!reply){alert('학생에게 전달할 메시지를 입력해주세요.');return;}
  const idx=state.pwRequests.findIndex(r=>r.id===reqId);
  if(idx>=0){
    state.pwRequests[idx].status='done';
    state.pwRequests[idx].adminReply=reply;
    state.pwRequests[idx].repliedAt=new Date().toISOString();
    saveLocal();
    fbPatch('pwRequests',{[reqId]:state.pwRequests[idx]});
  }
  render();
}

function showChangePw(){
  _modalOpen=true;
  document.getElementById('profile-action-area').innerHTML=renderChangePw();
  document.getElementById('profile-action-area').scrollIntoView({behavior:'smooth'});
}
function showPwReq(){
  _modalOpen=true;
  document.getElementById('profile-action-area').innerHTML=renderPwRequest();
  document.getElementById('profile-action-area').scrollIntoView({behavior:'smooth'});
}

showLoadingScreen();

(async()=>{
  await loadFromFirebase(); // 내부에서 에러를 잡으므로 절대 throw 안 함
  render();                 // 항상 실행됨
  if(state.user) startPolling();
})();
</script>
